[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-claude-code-langchain"
version = "0.1.0"
description = "章章可运行的 LangChain/LangGraph 教学 harness（Claude Code 机制拆解）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.11",
    "langchain-openai==1.3.3",
    "langgraph==1.2.7",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 该文件按上游的逐章循环式测试组织；闭包会在本轮 subTest 内立即执行。
"tests/test_agent_teams_runtime.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
