name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install -U pip pytest ruff
      - name: Lint (harness + tests)
        run: ruff check harness tests
      - name: Run tests (py_compile every chapter + harness unit tests)
        run: pytest -q
